name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # OPTIONAL DEBUG — remove once you confirm the secret is valid
      - name: 🔍 Debug GCP secret
        run: |
          echo "Secret length: ${#GCP_CREDENTIALS}"
          echo "${{ secrets.GCP_CREDENTIALS }}" | head -n1
          echo "${{ secrets.GCP_CREDENTIALS }}" | jq . >/dev/null && echo "✅ Valid JSON" || echo "❌ Invalid JSON"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: nam-final
          install_components: 'beta'

      - name: Build and Deploy to Cloud Run
        run: |
          gcloud builds submit --tag gcr.io/nam-final/nam
          gcloud run deploy nam \
            --image gcr.io/nam-final/nam \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated
